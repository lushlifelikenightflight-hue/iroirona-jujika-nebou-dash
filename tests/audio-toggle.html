<!doctype html><html lang="ja"><meta charset="utf-8"><title>音声ON／OFF検証</title><style>body{background:#191323;color:#f1dec5;font:14px system-ui;margin:12px}button{padding:12px}iframe{display:block;width:390px;height:844px;border:0}pre{white-space:pre-wrap}</style><button id="run" disabled>音声ON／OFFを検証</button><pre id="report">準備中</pre><iframe id="game" src="../?qa&amp;v=1.9.3"></iframe><script type="module">
const frame=document.getElementById('game'),report=document.getElementById('report'),button=document.getElementById('run'),wait=ms=>new Promise(r=>setTimeout(r,ms));const ready=setInterval(()=>{if(frame.contentWindow.__gameQA){clearInterval(ready);button.disabled=false;report.textContent='準備完了';}},100);
button.onclick=async()=>{const checks=[];const check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name);};try{const q=frame.contentWindow.__gameQA,d=frame.contentDocument;await q.action('title');q.audio.setMuted(true);check(d.getElementById('audio-status').textContent.includes('OFF'),'初期OFF表示');d.querySelector('[data-do="audio-toggle"]').click();for(let i=0;i<100&&q.audio.state==='starting';i++)await wait(50);check(q.audio.state==='playing'&&!q.audio.musicElement.paused,'タイトルのタップでBGM再生');check(d.getElementById('audio-status').textContent==='BGM / 効果音 ON','ON表示が更新される');const began=q.audio.musicElement.currentTime;await wait(200);check(q.audio.musicElement.currentTime>began,'再生時刻が進む');d.querySelector('[data-do="audio-toggle"]').click();check(q.audio.muted&&q.audio.musicElement.paused&&q.audio.master.gain.value===0,'OFFでBGM停止と効果音無音');check(d.getElementById('audio-status').textContent==='BGM / 効果音 OFF','OFF表示が更新される');await q.action('new');q.action('play');check(q.audio.muted&&d.getElementById('sound').textContent==='音 OFF','開始後もOFFを維持');d.getElementById('sound').click();for(let i=0;i<100&&q.audio.state==='starting';i++)await wait(50);check(q.audio.state==='playing'&&d.getElementById('sound').textContent==='音 ON','ゲーム内ボタンでもON');q.game.pause();d.querySelector('[data-do="audio-toggle"]').click();q.game.resume();check(q.audio.muted&&q.audio.musicElement.paused,'ポーズ中のOFFを再開後も維持');q.game.pause(true);report.textContent=JSON.stringify({passed:checks.length,checks},null,2);}catch(e){report.textContent='FAIL '+e.stack;}};
</script></html>
