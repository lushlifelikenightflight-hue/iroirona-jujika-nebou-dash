<!doctype html><html lang="ja"><meta charset="utf-8"><title>v1.7 操作と戦闘の確認</title><style>body{background:#171120;color:#eadde7;font:14px system-ui;margin:16px}button{margin:4px;padding:12px;background:#573449;color:#fff;border:1px solid #c59ab2}pre{white-space:pre-wrap}iframe{display:block;width:390px;height:844px;border:1px solid #b288a3}body.preview{margin:0}body.preview>h1,body.preview>button,body.preview>pre{display:none}body.preview iframe{position:fixed;inset:0;width:100%!important;height:100svh!important;border:0}</style><h1>v1.7 操作・戦闘</h1><button id="check">変更をまとめて検証</button><button id="beam">4方向の光を表示</button><button id="shield">追従する氷を表示</button><button id="fly">飛行敵の予兆を表示</button><button id="performance">描画周期を測定</button><pre id="report">読み込み待ち</pre><iframe id="game" src="../?qa&amp;v=1.7.0"></iframe><script type="module">
const frame=document.getElementById('game'),report=document.getElementById('report'),wait=ms=>new Promise(r=>setTimeout(r,ms));
function qa(){const q=frame.contentWindow.__gameQA;if(!q)throw Error('素材読み込み待ち');return q;}
async function setup(id=4){const q=qa();await q.action('new');q.game.loadStage(4);q.game.run.crew=[0,1,2,3,4];q.game.select(id);q.action('play');q.resetInput();const w=q.game.world;w.items=[];w.gimmicks=[];w.platforms=[{x:0,y:420,w:4800,h:160}];w.enemies=[];Object.assign(w.player,{x:3700,y:200,vx:0,vy:0,grounded:false});return q;}
const step=(g,n,input={})=>{for(let i=0;i<n;i++)g.step(1/120,input);};
document.getElementById('check').onclick=async()=>{const checks=[];function check(ok,name){if(!ok)throw Error(name);checks.push(name);}try{
 let q=await setup(),g=q.game,w=g.world,p=w.player,d=frame.contentDocument;
 check(d.querySelectorAll('#roster button').length===1,'交代はボタン1つ');check(d.getElementById('touch-controls').contains(d.getElementById('roster')),'交代は操作パネル内');check(!d.getElementById('hud').contains(d.getElementById('roster')),'交代はHUDから移動');
 for(const [width,height] of [[390,844],[360,640],[844,390]]){frame.style.width=width+'px';frame.style.height=height+'px';await wait(120);const b=d.getElementById('switch-button').getBoundingClientRect(),c=d.getElementById('crouch').getBoundingClientRect();check(b.bottom<=c.top+1&&Math.abs((b.left+b.right-c.left-c.right)/2)<1,`${width}×${height}:交代がしゃがむの真上`);check(b.width>=44&&b.height>=44,`${width}×${height}:交代のタッチ範囲`);check(d.documentElement.scrollWidth<=width&&c.bottom<=height,`${width}×${height}:操作が画面内`);}
 frame.style.width='390px';frame.style.height='844px';await wait(120);q=await setup();g=q.game;w=g.world;p=w.player;g.attack();check(w.effects.filter(f=>f.id===4).length===1,'光4本で1回の能力発動');const f=w.effects[0];w.enemies=[[-1,-1],[-1,1],[1,-1],[1,1]].map(([x,y])=>({x:f.x+x*130-8,y:f.y+y*130-8,w:16,h:16,hp:10,kind:'bell',cooldown:100,t:0,stunned:5}));step(g,1);check(w.enemies.every(e=>e.hp===8),'4方向の敵に同時ヒット');step(g,5);check(w.enemies.every(e=>e.hp===8),'同じ発射で多重ダメージなし');
 q=await setup(3);g=q.game;w=g.world;p=w.player;p.y=344;p.grounded=true;g.attack();const ice=w.effects[0],start=ice.x;step(g,35,{right:true});check(ice.x>start+50&&ice.x===p.x+15+85,'氷が歩行に追従');step(g,20,{left:true});check(ice.face===-1&&ice.x===p.x+15-85,'氷が振り向きに追従');step(g,1,{jump:true});check(ice.y===p.y+p.h-150,'氷がジャンプに追従');g.select(0);step(g,1);check(w.effects.includes(ice),'交代後も盾の寿命を維持');step(g,200);check(!w.effects.includes(ice),'氷は2秒後に消える');
 q=await setup();g=q.game;g.loadStage(4);q.action('play');const boss=g.world.enemies.find(e=>e.kind==='boss');g.kill(boss);await wait(80);check(d.getElementById('score').textContent==='2,500','HUDのボス得点2500');g.finish(false);await q.action('results');check(d.getElementById('overlay').textContent.includes('× 2,500'),'結果内訳のボス得点2500');
 q=await setup();g=q.game;g.loadStage(4);q.action('play');const flyers=g.world.enemies.filter(e=>e.airAttack);check(flyers.length>=2,'終盤に射撃する飛行敵');const e=flyers[0];g.world.enemies=[e];g.world.player.x=e.x-200;e.cooldown=0;step(g,1);check(e.windup>0&&!g.world.shots.length,'飛行敵に発射前の予兆');step(g,60);check(g.world.shots.length>0&&g.world.shots[0].vy>0,'飛行敵がプレイヤーへ斜めに射撃');g.pause(true);report.textContent=JSON.stringify({passed:checks.length,checks},null,2);frame.dataset.checked='passed';
 }catch(error){report.textContent='FAIL '+error.stack;frame.dataset.checked='failed';}};
document.getElementById('beam').onclick=async()=>{const q=await setup();q.game.attack();q.game.pause(true);report.textContent='4方向の光を表示';document.body.classList.add('preview');};
document.getElementById('shield').onclick=async()=>{const q=await setup(3),p=q.game.world.player;p.y=344;p.grounded=true;q.game.attack();step(q.game,35,{left:true});q.game.pause(true);report.textContent='左に移動・反転した盾を表示';document.body.classList.add('preview');};
document.getElementById('fly').onclick=async()=>{const q=await setup(0);q.game.loadStage(4);q.action('play');const w=q.game.world,e=w.enemies.find(e=>e.airAttack);w.enemies=[e];w.player.x=e.x-80;e.cooldown=0;step(q.game,1);q.game.pause(true);report.textContent='射撃する飛行敵と光の予兆を表示';document.body.classList.add('preview');};
document.getElementById('performance').onclick=async()=>{const q=await setup();q.game.attack();let frames=0,start;await new Promise(resolve=>{function count(now){start??=now;frames++;if(now-start>=1000){report.textContent=JSON.stringify({frames,elapsedMs:now-start,fps:frames*1000/(now-start)},null,2);q.game.pause(true);resolve();}else frame.contentWindow.requestAnimationFrame(count);}frame.contentWindow.requestAnimationFrame(count);});};
frame.onload=()=>{const timer=setInterval(()=>{if(frame.contentWindow.__gameQA){clearInterval(timer);report.textContent='準備完了';}},100);};
</script></html>
