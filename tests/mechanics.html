<!doctype html><html lang="ja"><meta charset="utf-8"><title>中央ドアとギミック確認</title><style>body{margin:0;background:#140f1e;color:#ebd4bc;font:14px sans-serif}header{padding:8px}button{padding:8px;background:#512f47;color:#f4debe;border:1px solid #aa8497}iframe{display:block;width:390px;height:844px;border:0;max-width:100vw}</style><header><button data-scene="room">中央ドア</button><button data-scene="spring">バネ</button><button data-scene="slide">滑り台</button><span id="status">準備中</span></header><iframe id="frame" src="../index.html?qa=1"></iframe><script type="module">
const frame=document.getElementById('frame'),status=document.getElementById('status');let qa;for(let i=0;i<100&&!qa;i++){qa=frame.contentWindow.__gameQA;if(!qa)await new Promise(r=>setTimeout(r,100));}if(!qa)throw Error('Game not ready');status.textContent='準備完了';document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{await qa.action('new');qa.action('play');const w=qa.game.world,p=w.player;w.enemies=[];w.items=[];if(b.dataset.scene==='room'){p.x=w.door.x+30;p.y=w.door.y+w.door.h-p.h;qa.game.interact();}else if(b.dataset.scene==='spring'){p.x=w.gimmicks[0].x+10;p.y=344;p.vx=0;for(let i=0;i<30;i++)qa.game.step(1/120);}else{const s=w.gimmicks[1];p.x=s.x+40;p.y=s.y+(p.x+15-s.x)/s.w*s.h-p.h;p.grounded=true;p.vx=300;for(let i=0;i<10;i++)qa.game.step(1/120,{right:true});}qa.game.pause(true);status.textContent=b.textContent+'表示中';});
</script></html>
