<!doctype html><html lang="ja"><meta charset="utf-8"><title>走りスプライト確認</title><style>body{background:#1c1828;color:#f0d7bc;font:16px sans-serif;margin:0}p{margin:12px}canvas{width:800px;max-width:100vw;image-rendering:pixelated}</style><p>右走り・左走り（各8コマ／12fps）</p><canvas id="canvas" width="800" height="700"></canvas><script type="module">
import {Renderer} from '../src/render.mjs';import {MEMBERS} from '../src/data.mjs';const renderer=new Renderer(document.getElementById('canvas'));await renderer.load();document.getElementById('canvas').setAttribute('data-ready','true');function frame(t){const c=renderer.ctx;c.fillStyle='#1c1828';c.fillRect(0,0,800,700);MEMBERS.forEach((m,i)=>{const y=i*135+125;c.fillStyle=m.color;c.font='18px sans-serif';c.fillText(m.name,20,y-75);c.fillStyle='#4f4158';c.fillRect(120,y,640,2);renderer.sprite(i,300,y,1,false,1,1.15,0,{grounded:true,vx:300,animTime:t/1000});renderer.sprite(i,610,y,-1,false,1,1.15,0,{grounded:true,vx:-300,animTime:t/1000});});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
