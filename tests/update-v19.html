<!doctype html><html lang="ja"><meta charset="utf-8"><title>v1.9 地形とギミックの確認</title><style>body{background:#171120;color:#eadde7;font:14px system-ui;margin:16px}button{margin:4px;padding:12px;background:#573449;color:#fff;border:1px solid #c59ab2}pre{white-space:pre-wrap}iframe{display:block;width:390px;height:844px;border:1px solid #b288a3}body.preview{margin:0}body.preview>h1,body.preview>button,body.preview>pre{display:none}body.preview iframe{position:fixed;inset:0;width:100%!important;height:100svh!important;border:0}</style><h1>v1.9 地形とギミック</h1><button id="check">変更をまとめて検証</button><button data-scene="1">風の谷を表示</button><button data-scene="2">氷の高台を表示</button><button data-scene="3">昇降台を表示</button><button data-scene="4">崩れる床を表示</button><button id="ending">Congratulationsを表示</button><button id="performance">描画周期を測定</button><pre id="report">読み込み待ち</pre><iframe id="game" src="../?qa&amp;v=1.9.0"></iframe><script type="module">
import {driveStage} from './playthrough-driver.mjs';
const frame=document.getElementById('game'),report=document.getElementById('report'),wait=ms=>new Promise(r=>setTimeout(r,ms));
function qa(){const q=frame.contentWindow.__gameQA;if(!q)throw Error('素材読み込み待ち');return q;}
async function setup(stage){const q=qa();await q.action('new');q.game.loadStage(stage);q.game.run.crew=[0,1,2,3,4];q.game.select(4);q.action('play');q.resetInput();return q;}
const tick=(g,n,input={})=>{for(let i=0;i<n;i++)g.step(1/120,input);};
document.getElementById('check').onclick=async()=>{const checks=[];function check(ok,name){if(!ok)throw Error(name);checks.push(name);}try{
 for(let stage=0;stage<5;stage++){const q=await setup(stage);q.game.world.enemies=[];q.game.world.items=[];const route=driveStage(q.game);check(route.mode==='clear'&&route.falls===0,`${stage+1}面:延長した全経路を実入力で転落なし走破`);if(stage===3)check(route.contacts.includes('ferry-last'),'追加の往復足場で最後の谷を渡る');if(stage===4)check(route.contacts.some(id=>Number(id.split('-')[1])>=15),'追加の連続崩落床を渡る');}
 for(let stage=1;stage<5;stage++){const q=await setup(stage),g=q.game,w=g.world;g.loadStage(stage);check(frame.contentDocument.querySelector('.stage-tip')?.textContent.length>10,`${stage+1}面の攻略ヒント`);q.action('play');check(w!==g.world,'開始時に地形を新規生成');}
 let q=await setup(1),g=q.game,w=g.world,p=w.player;w.enemies=[];w.items=[];w.gimmicks=[];p.x=2040;p.y=224;p.vx=300;p.grounded=true;tick(g,1,{right:true,jump:true});tick(g,115,{right:true});check(p.x>2400&&p.grounded,'追い風を使って広い谷を越える');
 q=await setup(2);g=q.game;w=g.world;p=w.player;w.enemies=[];w.items=[];w.gimmicks=[];p.x=2800;p.y=344;p.vx=300;p.grounded=true;tick(g,60);check(p.vx>240,'氷で入力を離しても滑り続ける');tick(g,60,{crouch:true});check(p.vx===0&&p.crouching,'しゃがむで氷の上をブレーキ');
 q=await setup(3);g=q.game;w=g.world;p=w.player;w.enemies=[];w.items=[];w.gimmicks=[];const lift=w.platforms.find(t=>t.id==='rider-lift');tick(g,80);check(lift.y===365&&!lift.active,'乗るまでは昇降台が待つ');Object.assign(p,{x:lift.x+60,y:lift.y-p.h,grounded:true,support:lift.id,vx:0,vy:0});tick(g,140);check(lift.active&&lift.y<300&&Math.abs(p.y+p.h-lift.y)<.01,'乗ると昇降台が動きプレイヤーを運ぶ');
 q=await setup(4);g=q.game;w=g.world;p=w.player;w.enemies=[];w.gimmicks=[];const tile=w.platforms.find(t=>t.kind==='crumble');Object.assign(p,{x:tile.x+25,y:tile.y-p.h,grounded:true,support:tile.id,vx:0,vy:0});tick(g,50);check(tile.armed&&!tile.gone,'崩落前に床が警告');tick(g,45);check(tile.gone&&p.y+p.h>tile.y,'一定時間後に床が消えて落下する');g.recover();check(!tile.gone,'失敗後は床が復帰して再挑戦');
 g.run.crew=[0,1,2,3,4];g.finish(false);const doc=frame.contentDocument;check(doc.querySelector('h2').textContent==='Congratulations!','全員エンディングのスペル修正');
 for(const [width,height] of [[390,844],[360,640],[844,390]]){frame.style.width=width+'px';frame.style.height=height+'px';await wait(120);const button=doc.querySelector('[data-do="results"]').getBoundingClientRect();check(button.bottom<=height&&button.top>=0,`${width}×${height}:エンディングボタンが画面内`);}
 frame.style.width='390px';frame.style.height='844px';await setup(1);await wait(100);const r=doc.getElementById('switch-button').getBoundingClientRect(),c=doc.getElementById('crouch').getBoundingClientRect();check(r.bottom<=c.top&&doc.documentElement.scrollWidth<=390,'交代としゃがむの配置と横幅を維持');qa().game.pause(true);report.textContent=JSON.stringify({passed:checks.length,checks},null,2);frame.dataset.checked='passed';
 }catch(error){report.textContent='FAIL '+error.stack;frame.dataset.checked='failed';}};
for(const button of document.querySelectorAll('[data-scene]'))button.onclick=async()=>{
 const stage=Number(button.dataset.scene),q=await setup(stage),g=q.game,w=g.world,p=w.player;
 w.enemies=[];w.items=[];
 if(stage===1){Object.assign(p,{x:3640,y:344,vx:300,vy:0,grounded:true});tick(g,1,{right:true});}
 if(stage===2){Object.assign(p,{x:4500,y:304,vx:250,vy:0,grounded:true});tick(g,1,{left:true});}
 if(stage===3){const lift=w.platforms.find(t=>t.id==='ferry-last');lift.active=true;lift.phase=1.65;tick(g,1);Object.assign(p,{x:lift.x+lift.w/2-15,y:lift.y-p.h,vx:0,vy:0,support:lift.id,grounded:true});}
 if(stage===4){const tile=w.platforms.find(t=>t.id==='crumble-17');Object.assign(p,{x:tile.x+30,y:tile.y-p.h,vx:0,vy:0,support:tile.id,grounded:true});tick(g,55);}
 g.pause(true);report.textContent=button.textContent;document.body.classList.add('preview');
};
document.getElementById('ending').onclick=async()=>{const q=await setup(4);q.game.finish(false);document.body.classList.add('preview');};
document.getElementById('performance').onclick=async()=>{const q=await setup(3);q.game.attack();let frames=0,start;await new Promise(resolve=>{function count(now){start??=now;frames++;if(now-start>=1000){report.textContent=JSON.stringify({frames,elapsedMs:now-start,fps:frames*1000/(now-start)},null,2);q.game.pause(true);resolve();}else frame.contentWindow.requestAnimationFrame(count);}frame.contentWindow.requestAnimationFrame(count);});};
frame.onload=()=>{const timer=setInterval(()=>{if(frame.contentWindow.__gameQA){clearInterval(timer);report.textContent='準備完了';}},100);};
</script></html>
