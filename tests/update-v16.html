<!doctype html><html lang="ja"><meta charset="utf-8"><title>v1.6 操作確認</title><style>body{background:#171120;color:#e6d2dc;font:14px system-ui;margin:16px}button{margin:4px;padding:12px;background:#573449;color:#fff;border:1px solid #c59ab2}pre{white-space:pre-wrap}iframe{display:block;width:390px;height:844px;border:1px solid #b288a3;margin-top:12px}</style><h1>v1.6 交代・走り・能力</h1><button id="check">操作をまとめて検証</button><button id="right">右に走る</button><button id="left">左に走る</button><button id="stop">停止</button><button id="ponite">ぽにて：雷</button><button id="benzo">べんぞー：氷</button><button id="king">きんぐ：光</button><pre id="report">ゲームの読み込み待ち</pre><iframe id="game" src="../?qa&amp;v=1.6.0"></iframe><script type="module">
const frame=document.getElementById('game'),report=document.getElementById('report');const pause=ms=>new Promise(r=>setTimeout(r,ms));
function context(){const qa=frame.contentWindow.__gameQA;if(!qa)throw Error('ゲームの読み込み待ち');return qa;}
async function prepare(){const qa=context();await qa.action('new');qa.game.run.crew=[0,2,3,4];qa.game.select(0);qa.action('play');qa.game.world.enemies=[];qa.game.world.items=[];qa.game.world.gimmicks=[];qa.game.world.platforms=[{x:0,y:420,w:3600,h:160}];qa.game.world.player.x=1300;frame.contentWindow.focus();return qa;}
document.getElementById('check').onclick=async()=>{try{const qa=await prepare(),doc=frame.contentDocument,checks=[];const assert=(ok,name)=>{if(!ok)throw Error(name);checks.push(name);};assert(doc.querySelectorAll('#roster button').length===1,'交代ボタンは1つ');assert(!doc.getElementById('switch-button').disabled,'仲間加入後に交代できる');const expected=[2,3,4,0];for(const id of expected){doc.getElementById('switch-button').click();await pause(90);assert(qa.game.run.selected===id,'交代先 '+id);}qa.game.run.crew=[0];qa.game.select(0);assert(doc.getElementById('switch-button').disabled,'1人のときは交代無効');qa.game.run.crew=[0,2,3,4];qa.game.select(0);qa.held.axis=1;await pause(220);assert(qa.game.world.player.face===1&&qa.game.world.player.vx>0,'右に走る');qa.held.axis=-1;await pause(350);assert(qa.game.world.player.face===-1&&qa.game.world.player.vx<0,'左に走る');qa.resetInput();await pause(230);assert(Math.abs(qa.game.world.player.vx)<1,'離すと停止');for(const id of [2,3,4]){qa.game.select(id);qa.game.cooldowns[id]=0;doc.getElementById('attack-button').click();await pause(25);assert(qa.game.world.effects.some(f=>f.id===id),'能力発動 '+id);}const box=doc.getElementById('switch-button').getBoundingClientRect();assert(box.width>=150&&box.height>=40,'交代ボタンのタッチサイズ');assert(doc.documentElement.scrollWidth<=390,'縦画面で横にはみ出さない');report.textContent=JSON.stringify({passed:checks.length,checks,selected:qa.game.run.selected,crew:qa.game.run.crew},null,2);frame.dataset.checked='passed';}catch(error){report.textContent='FAIL '+error.message;frame.dataset.checked='failed';}};
for(const [button,axis] of [['right',1],['left',-1],['stop',0]])document.getElementById(button).onclick=async()=>{let qa=context();if(qa.game.mode!=='play')qa=await prepare();qa.resetInput();qa.held.axis=axis;frame.contentWindow.focus();report.textContent=axis?'走りを目視確認中':'停止';};
for(const [button,id] of [['ponite',2],['benzo',3],['king',4]])document.getElementById(button).onclick=async()=>{let qa=context();if(qa.game.mode!=='play')qa=await prepare();qa.resetInput();qa.game.select(id);qa.game.cooldowns[id]=0;qa.game.world.player.face=1;qa.game.attack();frame.contentWindow.focus();await pause(id===2?120:40);qa.game.pause(true);report.textContent=['','','ぽにての雷','べんぞーの氷','きんぐの光'][id]+'の表示を静止確認';};
frame.onload=()=>{const timer=setInterval(()=>{if(frame.contentWindow.__gameQA){clearInterval(timer);report.textContent='準備完了。操作をまとめて検証、または走り／能力を選択。';}},100);};
</script></html>
