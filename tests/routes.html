<!doctype html><html lang="ja"><meta charset="utf-8"><title>寄り道と縦ライブ確認</title><style>body{margin:0;background:#140f1e;color:#ebd4bc;font:14px sans-serif}header{padding:8px}button{padding:8px;background:#512f47;color:#f4debe;border:1px solid #aa8497}iframe{display:block;width:390px;height:844px;border:0;max-width:100vw}</style><header><button data-scene="pit">地下の家</button><button data-scene="sky">バネの高台</button><button data-scene="sealed">封印された家</button><button data-scene="revealed">魔物を倒した後</button><button data-scene="tunnel">しゃがみ通路</button><button data-scene="full">5人ライブ</button><span id="status">準備中</span></header><iframe id="frame" src="../index.html?qa=1"></iframe><script type="module">
const frame=document.getElementById('frame'),status=document.getElementById('status');let qa;for(let i=0;i<100&&!qa;i++){qa=frame.contentWindow.__gameQA;if(!qa)await new Promise(r=>setTimeout(r,100));}if(!qa)throw Error('Game not ready');status.textContent='準備完了';document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{await qa.action('new');const scene=b.dataset.scene,stage={pit:1,sky:2,sealed:3,revealed:3,tunnel:0,full:4}[scene];qa.game.loadStage(stage);qa.action('play');const w=qa.game.world,p=w.player;if(scene==='full'){qa.game.run.crew=[0,1,2,3,4];qa.game.finish(false);status.textContent='縦画面ライブ';return;}if(scene==='revealed')for(const e of w.enemies.filter(e=>e.guardId))qa.game.kill(e);if(scene==='pit'){p.x=1340;p.y=760-p.h;}if(scene==='sky'){p.x=2460;p.y=-120-p.h;}if(scene==='sealed'||scene==='revealed'){p.x=2180;p.y=275-p.h;}if(scene==='tunnel'){w.enemies=[];p.x=2500;p.y=378;p.h=42;p.crouching=true;qa.game.step(1/120,{right:true,crouch:true});}qa.game.pause(true);status.textContent=b.textContent+'表示中';});
</script></html>
