<!doctype html><html lang="ja"><meta charset="utf-8"><title>ステージ進行の検証</title><style>body{margin:0;background:#191323;color:#f1dec5;font:14px system-ui}header{padding:12px}button{padding:12px}pre{white-space:pre-wrap}iframe{width:390px;height:844px;border:0}</style><header><button id="run" disabled>通信断・音声エラー時の進行を検証</button><pre id="report">準備中</pre></header><iframe id="game" src="../?qa&amp;v=1.9.2"></iframe><script type="module">
const frame=document.getElementById('game'),report=document.getElementById('report'),run=document.getElementById('run');
const timer=setInterval(()=>{if(frame.contentWindow.__gameQA){clearInterval(timer);run.disabled=false;report.textContent='準備完了';}},100);
run.onclick=async()=>{const checks=[];const check=(v,n)=>{if(!v)throw Error(n);checks.push(n);};let q,oldPlay,oldFetch,oldResume;try{q=frame.contentWindow.__gameQA;const d=frame.contentDocument,w=frame.contentWindow,g=q.game;await q.action('new');q.action('play');oldPlay=q.audio.musicElement.play;oldFetch=w.fetch;oldResume=q.audio.context.resume;w.fetch=()=>Promise.reject(Error('offline fixture'));q.audio.musicElement.play=()=>{throw Error('play interrupted fixture');};
for(let s=0;s<5;s++){g.loadStage(s);q.action('play');g.world.enemies=[];g.world.player.x=g.world.length-110;g.step(1/120);check(Boolean(d.querySelector('[data-do="next"]')),`${s+1}面のクリア画面`);const button=d.querySelector('[data-do="next"]');button.click();if(s<4){check(g.mode==='intro'&&g.run.stage===s+1,`${s+1}→${s+2}面:通信断と音声エラーでも進む`);button.click();check(g.run.stage===s+1,'二重クリックで面を飛ばさない');q.audio.context.resume=()=>new Promise(()=>{});d.querySelector('[data-do="play"]').click();check(g.mode==='play'&&d.getElementById('overlay').hidden,'音声再開の待機が画面移動を止めない');q.audio.context.resume=oldResume;}else check(g.mode==='ending'&&Boolean(d.querySelector('[data-do="results"]')),'最終面は結末へ進む');}
report.textContent=JSON.stringify({passed:checks.length,checks},null,2);frame.dataset.checked='passed';
}catch(e){report.textContent='FAIL '+e.stack;frame.dataset.checked='failed';}finally{if(q&&oldPlay)q.audio.musicElement.play=oldPlay;if(oldFetch)frame.contentWindow.fetch=oldFetch;if(q&&oldResume)q.audio.context.resume=oldResume;q?.game.pause(true);}};
</script></html>
