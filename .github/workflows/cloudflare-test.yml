name: Test Cloudflare publication controls
on:
  push:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
      - run: npm run typecheck
        working-directory: cloudflare
      - run: npm run build
        working-directory: cloudflare
      - run: node tools/test-auth.mjs
        working-directory: cloudflare
