<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>管理者ログイン | 寝坊ダッシュ</title><link rel="stylesheet" href="/admin/login.css"><script type="module" src="/admin/login.mjs"></script></head><body><main><p class="eyebrow">寝坊ダッシュ ／ 公開管理</p><h1 id="heading">管理者ログイン</h1><p id="description">管理画面に入るためのパスワードを入力してください。</p><p id="feedback" role="status" aria-live="polite">確認しています…</p><form id="login"><label id="setup-key-label" hidden>初回登録用の鍵<input id="setup-key" type="password" autocomplete="off" spellcheck="false"></label><label>パスワード<input id="password" type="password" autocomplete="current-password" minlength="16" maxlength="256" required></label><label id="confirm-label" hidden>パスワード（確認）<input id="confirm" type="password" autocomplete="new-password" minlength="16" maxlength="256"></label><p id="setup-note" hidden>16文字以上の、ほかで使っていないパスワードを設定してください。登録用の鍵は一度だけ使えます。</p><button id="submit" disabled>ログイン</button></form><p class="foot">ログインは8時間で終了します。共有端末では、操作後にログアウトしてください。</p><a href="/">ゲームの公開状態へ</a></main></body></html>
