<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#171120"><meta name="description" content="色々な十字架の5人で、寝坊した朝からライブハウスへ。スマホ横画面で遊べる全5ステージのゴシック横スクロールアクション。"><title>寝坊ダッシュ | 色々な十字架</title><link rel="icon" href="assets/art/dark.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><main id="game-shell"><canvas id="canvas" width="960" height="540" aria-label="横スクロールゲーム。左右で移動、Spaceでジャンプ、Xで能力、Cで交代、Eで部屋に入る。"></canvas>
<section id="hud" hidden><div class="stage-tag"><span id="stage-number">STAGE 01</span><b id="stage-name">寝坊の街</b></div><div class="stats"><span id="hp" aria-label="体力"></span><span id="timer">12:00</span><span class="score-label">SCORE <b id="score">0</b></span></div><div id="roster" aria-label="操作メンバー"></div><button id="sound" class="mini" aria-label="音声を切り替える">♪</button><button id="pause" class="mini" aria-label="一時停止">Ⅱ</button></section>
<div id="skill-status" hidden></div><div id="toast" role="status" aria-live="polite"></div>
<div id="touch-controls" hidden><div class="move"><button data-control="left" aria-label="左に移動">◀</button><button data-control="right" aria-label="右に移動">▶</button></div><button id="interact" data-action="interact">入る <small>E</small></button><div class="actions"><button data-action="attack" id="attack-button">闇<small>X</small></button><button data-action="jump" class="jump">跳<small>SPACE</small></button></div></div>
<section id="overlay" aria-live="polite"></section>
</main><section id="rotate" hidden><span>↻</span><h2>横にして、駆け出そう。</h2><p>このゲームはスマホの横画面で遊べます。</p></section><div id="loading"><div class="sigil">✝</div><p>開演の準備中…</p><span id="load-progress">画像と音を読み込んでいます</span></div><script type="module" src="src/main.mjs"></script></body></html>
