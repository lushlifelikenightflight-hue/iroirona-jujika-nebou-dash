<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#171120"><meta name="description" content="5人の仲間でライブハウスへ。スマホ縦画面で遊べる全5ステージのゴシック横スクロールアクション。"><title>寝坊ダッシュ</title><link rel="icon" href="assets/art/dark.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=1.6.1"></head>
<body><main id="game-shell"><div id="game-view"><canvas id="canvas" width="540" height="540" aria-label="横スクロールゲーム。左右で移動、Spaceでジャンプ、Xで能力、下でしゃがむ、Cで交代、Eで部屋に入る。"></canvas></div>
<section id="hud" hidden><div class="stage-tag"><span id="stage-number">STAGE 01</span><b id="stage-name">寝坊の街</b></div><div class="stats"><span id="hp" aria-label="体力"></span><span id="timer">12:00</span><span class="score-label">SCORE <b id="score">0</b></span></div><div id="roster" aria-label="操作メンバー"><button id="switch-button" data-action="switch" disabled><span id="switch-label">交代</span><small id="switch-current">操作中：たかし · 仲間 1/5</small></button></div><button id="sound" class="mini" aria-label="音声を切り替える">♪</button><button id="pause" class="mini" aria-label="長押しでメニュー" title="700ms長押しでメニュー">Ⅱ<small>長押し</small></button></section>
<div id="skill-status" hidden></div><div id="toast" role="status" aria-live="polite"></div>
<div id="touch-controls" hidden><div id="joystick" class="stick-base" role="slider" tabindex="0" aria-label="移動スティック" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-valuetext="停止"><span class="stick-ring"></span><span class="stick-knob"></span><span class="stick-label">MOVE</span></div><div class="utility"><button id="interact" data-action="interact">入る <small>E</small></button><button id="crouch" data-action="crouch" aria-label="長押しでしゃがむ" aria-pressed="false">しゃがむ <small>長押し / ↓</small></button></div><div class="actions"><button data-action="attack" id="attack-button">闇<small>X</small></button><button data-action="jump" class="jump">跳<small>SPACE</small></button></div></div>
<section id="overlay" aria-live="polite"></section>
</main><div id="loading"><div class="sigil">✝</div><p>開演の準備中…</p><span id="load-progress">画像と音を読み込んでいます</span></div><script type="module" src="src/main.mjs?v=1.6.1"></script></body></html>
